<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPIO Pin Reference / Simulator</title><link rel="stylesheet" href="../common.css">
<style>
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;width:320px;margin:0 auto;background:#0a3d0a;padding:14px;border-radius:8px}
.pin{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:.75rem;color:#fff}
.pin .num{width:22px;height:22px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7rem}
.pin.power .num{background:#f56565}
.pin.ground .num{background:#333}
.pin.gpio .num{background:#4fd1c5;color:#0f1420}
.pin.gpio.active .num{background:#48bb78;box-shadow:0 0 8px #48bb78}
select{min-width:140px}
#detail{margin-top:14px;color:var(--muted)}
</style></head>
<body>
<h1>GPIO Pin Reference / Simulator</h1>
<p class="subtitle">Raspberry Pi 40-pin header reference — click a GPIO pin to toggle HIGH/LOW.</p>

<div class="row">
  <div><label>Board</label><select id="board"><option>Raspberry Pi 4 (40-pin)</option></select></div>
</div>

<div class="panel">
  <div class="board" id="board40"></div>
  <div id="detail">Click a GPIO (teal) pin to toggle it. Red = 5V/3.3V power. Black = Ground.</div>
</div>

<script>
// Simplified physical pin layout (physical pin number : label)
const PINS = [
  [1,'3V3',"power"],[2,'5V',"power"],
  [3,'GPIO2 (SDA)',"gpio"],[4,'5V',"power"],
  [5,'GPIO3 (SCL)',"gpio"],[6,'GND',"ground"],
  [7,'GPIO4',"gpio"],[8,'GPIO14 (TXD)',"gpio"],
  [9,'GND',"ground"],[10,'GPIO15 (RXD)',"gpio"],
  [11,'GPIO17',"gpio"],[12,'GPIO18',"gpio"],
  [13,'GPIO27',"gpio"],[14,'GND',"ground"],
  [15,'GPIO22',"gpio"],[16,'GPIO23',"gpio"],
  [17,'3V3',"power"],[18,'GPIO24',"gpio"],
  [19,'GPIO10 (MOSI)',"gpio"],[20,'GND',"ground"],
  [21,'GPIO9 (MISO)',"gpio"],[22,'GPIO25',"gpio"],
  [23,'GPIO11 (SCLK)',"gpio"],[24,'GPIO8 (CE0)',"gpio"],
  [25,'GND',"ground"],[26,'GPIO7 (CE1)',"gpio"],
  [27,'GPIO0 (ID_SD)',"gpio"],[28,'GPIO1 (ID_SC)',"gpio"],
  [29,'GPIO5',"gpio"],[30,'GND',"ground"],
  [31,'GPIO6',"gpio"],[32,'GPIO12',"gpio"],
  [33,'GPIO13',"gpio"],[34,'GND',"ground"],
  [35,'GPIO19',"gpio"],[36,'GPIO16',"gpio"],
  [37,'GPIO26',"gpio"],[38,'GPIO20',"gpio"],
  [39,'GND',"ground"],[40,'GPIO21',"gpio"],
];

const boardEl = document.getElementById('board40');
const state = {};

PINS.forEach(([num,label,type])=>{
  const d = document.createElement('div');
  d.className = 'pin ' + type;
  d.innerHTML = `<span class="num">${num}</span><span>${label}</span>`;
  if(type==='gpio'){
    d.addEventListener('click', ()=>{
      state[num] = !state[num];
      d.classList.toggle('active', state[num]);
      document.getElementById('detail').textContent = `Physical pin ${num} (${label}) is now ${state[num] ? 'HIGH (3.3V)' : 'LOW (0V)'}.`;
    });
  } else {
    d.addEventListener('click', ()=>{
      document.getElementById('detail').textContent = `Pin ${num} is a fixed ${label} pin (not switchable).`;
    });
  }
  boardEl.appendChild(d);
});
</script>
</body></html>
