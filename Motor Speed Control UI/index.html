<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor Speed Control (PWM)</title><link rel="stylesheet" href="../common.css">
<style>
output{color:var(--accent);font-weight:700;font-size:1.2rem}
.motor{width:90px;height:90px;border-radius:50%;background:#161d2e;border:4px solid #232b40;display:flex;align-items:center;justify-content:center;margin:20px auto;position:relative}
.motor .blade{width:70px;height:8px;background:var(--accent);border-radius:4px;position:absolute}
canvas{width:100%;background:#0a0e18;border-radius:6px}
</style></head>
<body>
<h1>Motor Speed Control UI (PWM percentage)</h1>
<p class="subtitle">Drag the slider to set PWM duty cycle; the fan spins faster/slower and the PWM waveform updates.</p>

<div class="panel" style="text-align:center">
  <label>Duty cycle: <output id="oDuty">50</output>%</label>
  <input type="range" id="duty" min="0" max="100" value="50" style="width:80%">
  <div class="motor"><div class="blade" id="blade"></div></div>
  <div id="rpm" style="color:var(--muted)"></div>
</div>

<div class="panel"><canvas id="pwm" height="100"></canvas></div>

<script>
const duty = document.getElementById('duty');
const blade = document.getElementById('blade');
let angle = 0;
let rafId;

const MAX_RPM = 6000;

function drawPWM(dutyPct){
  const canvas = document.getElementById('pwm');
  const w = canvas.width = canvas.clientWidth, h = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#4fd1c5'; ctx.lineWidth=2;
  const cycles = 4;
  const cycleW = w/cycles;
  ctx.beginPath();
  let x=0;
  const baseY=h-20, highY=20;
  ctx.moveTo(0, baseY);
  for(let c=0;c<cycles;c++){
    const highW = cycleW*(dutyPct/100);
    ctx.lineTo(x, highY); ctx.lineTo(x+highW, highY); ctx.lineTo(x+highW, baseY); ctx.lineTo(x+cycleW, baseY);
    x += cycleW;
  }
  ctx.stroke();
  ctx.fillStyle='#8b93a7'; ctx.font='11px sans-serif';
  ctx.fillText(`Duty cycle: ${dutyPct}%`, 6, 14);
}

function animate(){
  const d = parseInt(duty.value);
  const speed = (d/100) * 15; // degrees per frame max
  angle = (angle + speed) % 360;
  blade.style.transform = `rotate(${angle}deg)`;
  rafId = requestAnimationFrame(animate);
}

function update(){
  const d = parseInt(duty.value);
  document.getElementById('oDuty').textContent = d;
  document.getElementById('rpm').textContent = `≈ ${Math.round((d/100)*MAX_RPM)} RPM`;
  drawPWM(d);
}

duty.addEventListener('input', update);
update();
animate();
</script>
</body></html>
